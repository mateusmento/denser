services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: denser
      POSTGRES_PASSWORD: denser
      POSTGRES_DB: denser
    volumes:
      - denser_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denser -d denser"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  denser_pgdata:
